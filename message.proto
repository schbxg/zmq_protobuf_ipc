syntax = "proto3";

package ipc;

// 通用消息结构
message Message {
    string id = 1;              // 消息ID
    int64 timestamp = 2;        // 时间戳
    string sender = 3;          // 发送者
    bytes payload = 4;          // 实际数据
    MessageType type = 5;       // 消息类型
}

enum MessageType {
    UNKNOWN = 0;
    REQUEST = 1;
    RESPONSE = 2;
    NOTIFICATION = 3;
}

// 请求消息
message Request {
    string method = 1;          // 方法名
    bytes params = 2;           // 参数
}

// 响应消息
message Response {
    bool success = 1;           // 是否成功
    string error = 2;           // 错误信息
    bytes result = 3;           // 结果
}
